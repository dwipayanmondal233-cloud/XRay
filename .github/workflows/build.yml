name: Build XRay

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'index.html' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Show APK permissions
        run: |
          AAPT="$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2" || true
          "$AAPT" dump permissions app/build/outputs/apk/debug/app-debug.apk || true

      - uses: actions/upload-artifact@v4
        with:
          name: XRay-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk XRay.apk
          gh release delete latest --cleanup-tag --yes --repo ${{ github.repository }} || true
          gh release create latest XRay.apk --repo ${{ github.repository }} --title "XRay (latest)" --notes "Newest build." --latest